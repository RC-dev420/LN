<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyric Notes</title>
<style>
:root{
  --paper:#E9E9E6; --paper-2:#DEDEDA; --ink:#232323; --ink-dim:#6B6B68;
  --rule:#D3D3CF; --accent:#B8860B; --accent-ink:#3A2E05; --danger:#A3402F;
  --card:#F5F5F3; --shadow:rgba(30,30,30,.12); --bin:#F7F7F5;
  box-sizing:border-box;
  /* No safe-area padding here: main and the fixed bars each apply their own,
     and applying it on the root too pushed everything down a second time. */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1E1E; --paper-2:#272727; --ink:#E9E9E6; --ink-dim:#9C9C98;
    --rule:#343434; --accent:#D9A93B; --accent-ink:#1C1706; --danger:#E06A54;
    --card:#262626; --shadow:rgba(0,0,0,.35); --bin:#303030;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1E1E; --paper-2:#272727; --ink:#E9E9E6; --ink-dim:#9C9C98;
  --rule:#343434; --accent:#D9A93B; --accent-ink:#1C1706; --danger:#E06A54;
  --card:#262626; --shadow:rgba(0,0,0,.35); --bin:#303030;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 100px;}
/* The bin sits a shade lighter than the page so the black spines read, and
   wraps the scroller so the edge arrows can sit above it. */
.nb-bin{
  display:none; position:relative; background:var(--bin);
  border:1px solid var(--rule); border-radius:14px; margin-bottom:14px;
  overflow:hidden; box-shadow:inset 0 1px 2px var(--shadow);
}
.nb-bin.show{display:block;}
/* Translucent triangles showing the row continues past that edge. */
.nb-arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:0; height:0; display:none; pointer-events:none; z-index:3; opacity:.4;
  border-top:9px solid transparent; border-bottom:9px solid transparent;
  filter:drop-shadow(0 0 3px var(--bin));
}
.nb-arrow.right{right:4px; border-left:12px solid var(--ink);}
.nb-arrow.left{left:4px;  border-right:12px solid var(--ink);}
.nb-bin.more-right .nb-arrow.right{display:block;}
.nb-bin.more-left  .nb-arrow.left{display:block;}
.nb-row{
  display:none; gap:8px; margin-bottom:0;
  overflow-x:auto; overflow-y:hidden; flex-wrap:nowrap;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  /* Room for the selection outline, which the scroll container would otherwise
     clip — along the top, and on the left at scroll position 0. */
  padding:9px 8px 10px;
  scroll-padding-left:8px;
}
.nb-row::-webkit-scrollbar{display:none;}
.nb-row.show{display:flex;}
/* Composition notebook: black binding tape down the left, solid cover in the
   notebook's own colour, cream label panel carrying the name. */
.nb-slot{
  /* Never narrower than it takes to fit "Notebook" on one label line
     (~49px of text plus the label padding and cover inset). However many
     fit, fit; the rest scroll. */
  flex:0 0 auto; width:clamp(88px, 22.5%, 104px);
  aspect-ratio:3 / 4; position:relative;
  cursor:pointer; scroll-snap-align:start;
  transition:transform .12s;
  border-radius:2px 6px 6px 2px;
}
/* The page block sits under the cover and peeks out right and bottom, so the
   notebook reads as a solid object rather than a flat rectangle. */
.nb-slot::before{
  content:''; position:absolute; left:7px; top:2px; right:2px; bottom:2px; z-index:1;
  /* Each layer's radius is the one below it plus the gap, so the edges stay
     parallel: front cover 6px, pages 9px, back cover 11px. */
  border-radius:1px 9px 9px 1px;
  background:
    repeating-linear-gradient(to bottom, #F4F0E4 0 2px, #D8D1BE 2px 3px);
}
/* The back cover, just visible past the pages — same colour as the front,
   darkened the way a face turned from the light would be. */
.nb-back{
  position:absolute; left:7px; top:3px; right:0; bottom:0; z-index:0;
  border-radius:1px 11px 11px 1px;
  filter:brightness(.6);
  box-shadow:1px 2px 5px var(--shadow);
}
/* Silver spiral coil, drawn over the binding tape: a metallic strip masked
   into slanted loops. */
.nb-slot::after{
  /* Sits left of the cover so the coil wraps past the edge of the spine. */
  /* Equal insets keep the coil centred; this length holds one ring fewer. */
  content:''; position:absolute; left:-3px; top:2px; bottom:2px; width:15px; z-index:3;
  background:linear-gradient(to right,
    #5F6166 0%, #9FA4AA 22%, #E8EBEF 46%, #FBFCFD 56%, #A9AEB4 74%, #56585D 100%);
  /* One loop per tile, the bar floating clear of the tile's own edges, with
     mask-repeat:round so a whole number of loops always fits the strip —
     otherwise the first and last loops get sliced by its ends. */
  -webkit-mask-image:linear-gradient(173deg,
    transparent 0 2.6px, #000 2.6px 4.6px, transparent 4.6px 8.5px);
  mask-image:linear-gradient(173deg,
    transparent 0 2.6px, #000 2.6px 4.6px, transparent 4.6px 8.5px);
  -webkit-mask-size:100% 8.5px; mask-size:100% 8.5px;
  -webkit-mask-repeat:round; mask-repeat:round;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));
  pointer-events:none;
}
.nb-slot.empty::after{display:none;}
.nb-cover{
  position:absolute; left:0; top:0; right:5px; bottom:5px; overflow:hidden; z-index:2;
  border:1px solid rgba(0,0,0,.45); border-radius:2px 6px 6px 2px;
  box-shadow:1px 1px 4px rgba(0,0,0,.28);
}
/* Marbled composition cover — mottled ink over a bone background. */
.marble{
  background-color:#0D0D0D !important;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27200%27%3E%3Cfilter%20id%3D%27m%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.13%27%20numOctaves%3D%273%27%20seed%3D%275%27%2F%3E%3CfeColorMatrix%20type%3D%27matrix%27%20values%3D%270%200%200%200%201%200%200%200%200%201%200%200%200%200%201%2018%200%200%200%20-10%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27160%27%20height%3D%27200%27%20fill%3D%27%230D0D0D%27%2F%3E%3Crect%20width%3D%27160%27%20height%3D%27200%27%20filter%3D%27url%28%23m%29%27%2F%3E%3C%2Fsvg%3E");
  /* Scaled to fill rather than tiled, so no repeat seam crosses the cover. */
  background-size:100% 100%;
  background-repeat:no-repeat;
}
/* The marbled cover keeps a black spine, like a real composition book. */
.nb-cover.marble::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:14px;
  background:#141414; z-index:1;
}
.nb-cover.marble .nb-count{color:rgba(255,255,255,.72);}
.nb-cover::after{                      /* soft sheen toward the fore-edge */
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to right, rgba(255,255,255,.07) 0 42%, rgba(0,0,0,.16));
}
.nb-label{
  /* Top edge pinned: a longer name grows downward instead of recentring, so
     the label always starts at the same height on every cover. */
  position:absolute; z-index:2; left:16px; right:7px; top:14%;
  background:#F2EFE4; color:#1F1F1F; border-radius:2px;
  padding:5px 3px; font-size:10px; font-weight:700; line-height:1.2;
  text-align:center; letter-spacing:.2px; word-break:break-word;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
  display:block; overflow:hidden;
}
/* Clamping lives on an inner box with no padding: overflow clips at the
   padding edge, so clamping the padded label itself leaks part of line 4. */
.nb-label > span{
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; max-height:3.6em;
}
.nb-count{
  position:absolute; z-index:2; left:16px; right:6px; bottom:3px;
  font-size:9.5px; color:rgba(255,255,255,.72); text-align:center;
}
.nb-slot.empty{
  border:1px dashed var(--rule); border-radius:7px; opacity:.5; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.nb-slot.empty:active{opacity:.9;}
.nb-slot.empty::before{display:none;}
.nb-slot.active{
  transform:translateY(-2px);
  outline:3px solid var(--accent); outline-offset:2px;
}
.nb-slot.drop-target{
  transform:scale(1.07);
  outline:3px solid var(--accent); outline-offset:2px;
}
.nb-plus{
  position:relative; width:20px; height:20px; color:var(--ink-dim); font-size:0;
}
.nb-plus::before, .nb-plus::after{
  content:''; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%); background:currentColor; border-radius:1px;
}
.nb-plus::before{width:18px; height:2px;}
.nb-plus::after{width:2px; height:18px;}
/* Cover-colour picker inside the notebook sheet */
.swatch-row{display:flex; flex-wrap:wrap; gap:9px; margin:0 0 12px 14px;}
.swatch{
  width:36px; height:36px; border-radius:6px; border:1px solid rgba(0,0,0,.4);
  cursor:pointer; padding:0; position:relative; overflow:hidden;
}
.swatch::before{                     /* a hint of the coil, as on the notebooks */
  content:''; position:absolute; left:0; top:0; bottom:0; width:6px;
  background:linear-gradient(to right, #5F6166, #E8EBEF 55%, #6B6E73);
}
.swatch.on{box-shadow:0 0 0 2px var(--accent);}
.song{
  background:var(--card); border:1px solid var(--rule); border-radius:12px;
  padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:transform .12s;
  touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
.song.drag-source{opacity:.35;}
.pin-icon{
  width:13px; height:13px; flex:0 0 13px; margin-right:6px;
  color:inherit;                      /* same colour as the title text */
}
.song{display:flex; align-items:center; gap:12px;}
.card-play{
  width:40px; height:40px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink);
  font-size:14px; cursor:pointer; flex-shrink:0;
}
.card-body{flex:1; min-width:0;}
.card-where{
  font-size:11.5px; color:var(--accent); margin-bottom:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-menu{
  background:none; border:none; color:var(--ink-dim); font-size:19px; letter-spacing:2px;
  cursor:pointer; padding:8px 4px; flex-shrink:0;
}
.sheet-btn{
  display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--rule);
  border-radius:10px; padding:14px 16px; margin-bottom:8px; font-size:15px; color:var(--ink);
  cursor:pointer; font-family:inherit;
}
.sheet-btn:active{background:var(--paper-2);}
.sheet-btn.danger{color:var(--danger);}
.sheet-sub{
  display:block; width:100%; text-align:left; background:none; border:none; border-left:2px solid var(--rule);
  padding:11px 16px; margin:0 0 6px 14px; font-size:14.5px; color:var(--ink); cursor:pointer; font-family:inherit;
}
.sheet-sub:active{background:var(--paper-2);}
.rename-row{display:flex; gap:8px; margin-bottom:10px;}
.rename-row input{
  flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--accent);
  background:var(--card); color:var(--ink); font-size:15px; outline:none; font-family:inherit;
}
.sheet-btn.muted{color:var(--ink-dim);}
/* Slim recording strip for in-editor takes — sits just above the button bar
   so the lyrics stay readable and scrollable while singing. */
.rec-strip{
  display:none; position:fixed; left:16px; right:16px; max-width:608px; margin:0 auto;
  bottom:calc(env(safe-area-inset-bottom,0px) + 76px); z-index:8;
  background:var(--card); border:1px solid var(--rule); border-radius:10px;
  padding:5px 12px; box-shadow:0 3px 10px var(--shadow);
  align-items:center; gap:10px;
}
.rec-strip.open{display:flex;}
.rec-dot{
  width:9px; height:9px; border-radius:50%; background:var(--danger); flex:0 0 9px;
  animation:recpulse 1.4s ease-in-out infinite;
}
.rec-strip.paused .rec-dot{animation:none; opacity:.4;}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.25}}
.mini-wave{flex:1; min-width:0; height:22px; display:block;}
.rec-time{
  font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink-dim); flex:0 0 auto;
}
/* Voice recording popup */
.voice-pop{
  display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  z-index:30; width:min(92vw, 400px);
  background:var(--paper); border:1px solid var(--rule); border-radius:16px;
  padding:18px 16px 16px; box-shadow:0 12px 34px var(--shadow);
}
.voice-pop.open{display:block;}
.voice-head{font-size:16px; font-weight:600; margin-bottom:12px;}
.wave{
  display:block; width:100%; height:74px; border-radius:10px;
  background:var(--card); border:1px solid var(--rule);
}
.voice-time{
  text-align:center; font-size:21px; font-variant-numeric:tabular-nums;
  margin:12px 0 14px; color:var(--ink);
}
.voice-time.live{color:var(--danger);}
.voice-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.voice-btns .sheet-btn{margin:0; text-align:center;}
.sheet-btn[disabled]{opacity:.45;}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:20px; font-size:14px;
  z-index:40; opacity:0; transition:opacity .2s; pointer-events:none;
}
.toast.show{opacity:.95;}
.version{
  text-align:center; font-size:11.5px; color:var(--ink-dim); opacity:.6;
  margin:22px 0 4px; user-select:none;
}
.drag-ghost{
  position:fixed; z-index:30; pointer-events:none; opacity:.92;
  background:var(--card); border:1px solid var(--accent); border-radius:12px;
  padding:14px 16px; box-shadow:0 10px 24px var(--shadow); font-size:16px; font-weight:600; color:var(--ink);
}
.fab-menu{
  position:fixed; right:20px; bottom:calc(env(safe-area-inset-bottom,0px) + 88px); z-index:14;
  display:none; flex-direction:column; gap:8px; align-items:flex-end;
}
.fab-menu.open{display:flex;}
.fab-item{
  background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:13px 18px;
  font-size:15px; color:var(--ink); cursor:pointer; font-family:inherit; box-shadow:0 4px 12px var(--shadow);
  white-space:nowrap;
}
.fab-item:active{background:var(--paper-2);}
.search{
  width:100%; padding:11px 14px; margin-bottom:14px; border-radius:10px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink);
  font-size:15px; outline:none;
}
.search:focus{border-color:var(--accent);}
.empty{text-align:center; color:var(--ink-dim); padding:60px 20px; font-size:15px; line-height:1.6;}
.song:active{transform:scale(.98);}
.song-title{font-weight:600; font-size:16px; display:flex; align-items:center;}
.song-meta{font-size:12px; color:var(--ink-dim); margin-top:6px; display:flex; gap:12px;}
.fab{
  position:fixed; right:20px; bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  border:none; box-shadow:0 6px 16px var(--shadow); cursor:pointer;
  /* The plus is drawn as two bars rather than typed as a character: a glyph
     sits on its font's baseline and lands off-centre in the circle. */
  font-size:0;
}
.fab::before, .fab::after{
  content:''; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%); background:currentColor; border-radius:2px;
}
.fab::before{width:22px; height:3px;}
.fab::after{width:3px; height:22px;}
#editor{display:none; max-width:640px; margin:0 auto; padding:0 16px 100px;}
/* Extra clearance so the last lines aren't hidden behind the recording strip. */
#editor.recording{padding-bottom:150px;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid var(--rule);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 4px 12px; margin-bottom:14px;
  display:flex; align-items:center; justify-content:space-between;
}
.iconbtn{background:none; border:none; color:var(--ink); font-size:15px; padding:8px 6px; cursor:pointer;}
.iconbtn.danger{color:var(--danger);}
#titleInput{
  width:100%; border:none; background:none; color:var(--ink); font-size:24px; font-weight:600;
  padding:6px 2px 10px; outline:none; font-family:inherit;
}
.lyrics-wrap{display:flex; gap:6px; align-items:flex-start;}
.line-gutter{
  flex:0 0 28px; text-align:right; padding-right:2px;
  font-size:13px; line-height:34px; color:var(--ink-dim); user-select:none; font-variant-numeric:tabular-nums;
}
.mirror{
  position:absolute; visibility:hidden; top:-9999px; left:-9999px; height:auto; box-sizing:border-box;
  white-space:pre-wrap; word-wrap:break-word; font-size:17px; line-height:34px;
  font-family:Georgia,"Iowan Old Style",serif; padding:0 2px;
}
#lyricsInput{
  flex:1; min-width:0; min-height:260px; border:none; background:linear-gradient(var(--paper) 0, var(--paper) 0) , repeating-linear-gradient(var(--paper), var(--paper) 33px, var(--rule) 34px);
  background-attachment:local; color:var(--ink); font-size:17px; line-height:34px; font-family:Georgia,"Iowan Old Style",serif;
  outline:none; resize:none; padding:0 2px;
}
.bottombar{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:6; max-width:640px; margin:0 auto;
  background:var(--paper); border-top:1px solid var(--rule);
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px); gap:10px;
}
.tool-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--card); border:1px solid var(--rule); border-radius:12px;
  padding:13px 8px; font-size:14.5px; color:var(--ink); cursor:pointer; font-family:inherit;
}
.tool-btn.recording{border-color:var(--danger); color:var(--danger);}
.tool-dot{width:12px; height:12px; border-radius:50%; background:var(--danger); flex-shrink:0;}
.tool-btn.recording .tool-dot{border-radius:3px;}
.menu-btn{
  flex:0 0 52px; display:flex; align-items:center; justify-content:center;
  background:var(--card); border:1px solid var(--rule); border-radius:12px;
  font-size:20px; color:var(--ink); cursor:pointer; letter-spacing:2px;
}
.menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:11; display:none;}
.menu-overlay.open{display:block;}
.menu-panel{
  position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 76px); z-index:12;
  background:var(--card); border:1px solid var(--rule); border-radius:12px; box-shadow:0 8px 20px var(--shadow);
  min-width:170px; padding:6px; display:none;
}
.menu-panel.open{display:block;}
.menu-item{
  display:block; width:100%; text-align:left; background:none; border:none; border-radius:8px;
  padding:12px 14px; font-size:15px; color:var(--ink); cursor:pointer; font-family:inherit;
}
.menu-item.danger{color:var(--danger);}
.menu-item:active{background:var(--paper-2);}
.tool-btn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.pick-prompt{
  display:none; position:fixed; left:16px; right:16px; max-width:608px; margin:0 auto;
  bottom:calc(env(safe-area-inset-bottom,0px) + 76px); z-index:8;
  background:var(--card); border:1px solid var(--rule); border-radius:10px;
  padding:10px 14px; font-size:13.5px; color:var(--ink-dim); text-align:center; box-shadow:0 4px 12px var(--shadow);
}
.pick-prompt.open{display:block;}
.rhyme-panel{
  display:none; position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 76px); z-index:7;
  max-width:640px; margin:0 auto; background:var(--paper); border:1px solid var(--rule); border-bottom:none;
  border-radius:16px 16px 0 0; padding:16px; max-height:44vh; overflow-y:auto; box-shadow:0 -8px 20px var(--shadow);
}
.rhyme-panel.open{display:block;}
.rhyme-word{
  display:inline-block; background:var(--card); border:1px solid var(--rule); border-radius:20px;
  padding:8px 14px; margin:0 6px 8px 0; font-size:14.5px; color:var(--ink);
}
.rhyme-group{
  font-size:11.5px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
  color:var(--ink-dim); margin:6px 0 8px; padding-top:6px; border-top:1px solid var(--rule);
}
.rhyme-group:first-child{border-top:none; padding-top:0; margin-top:0;}
.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:9; display:none;}
.sheet-overlay.open{display:block;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:10; max-width:640px; margin:0 auto;
  background:var(--paper); border-radius:16px 16px 0 0; border:1px solid var(--rule); border-bottom:none;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px); max-height:70vh; overflow-y:auto;
  display:none; box-shadow:0 -8px 24px var(--shadow);
}
.sheet.open{display:block;}
.sheet-header{display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:16px; margin-bottom:14px;}
.sheet-empty{color:var(--ink-dim); font-size:14.5px; padding:10px 2px 20px;}
.clip{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--rule);
  border-radius:10px; padding:10px 12px; margin-bottom:8px;
}
.playbtn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink);
  font-size:14px; cursor:pointer; flex-shrink:0;
}
.clip-name{flex:1; font-size:14.5px;}
.clip-date{font-size:12px; color:var(--ink-dim);}
.clip-del{background:none; border:none; color:var(--ink-dim); font-size:16px; cursor:pointer; padding:6px;}
</style>
</head>
<body>

  <div class="sheet-header"><span>Voice memos</span><button class="iconbtn" id="sheetClose">Done</button></div>
  <div id="clips"></div>
</div>

<script>
let db, current = null, songs = [], notebooks = [], activeNotebook = null, orderIds = [];
let activeAudio = null;
let memoryOnly = false, voiceSeq = 0;

function bootMessage(msg){
  const list = document.getElementById('list');
  if(list) list.innerHTML = `<div class="empty">${msg}</div>`;
}

// Always paint something first, so a storage problem can never leave a blank screen.
renderList();

let openReq;
try{
  openReq = indexedDB.open('lyricNotesDB', 3);
}catch(err){
  memoryOnly = true;
  bootMessage('Storage is unavailable in this browser view.<br>Notes will work but won\'t be saved.');
}

if(openReq){
  openReq.onupgradeneeded = e => {
    const d = e.target.result;
    if(!d.objectStoreNames.contains('songs')) d.createObjectStore('songs', {keyPath:'id'});
    if(!d.objectStoreNames.contains('notebooks')) d.createObjectStore('notebooks', {keyPath:'id'});
    if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'id'});
  };
  openReq.onblocked = () => {
    bootMessage('Another open tab of this app is holding your notes.<br>Close the other tabs, then reload this page.');
  };
  openReq.onerror = () => {
    memoryOnly = true;
    bootMessage('Couldn\'t open your notes storage.<br>Try reloading, or check that site data is allowed.');
  };
  openReq.onsuccess = e => {
    db = e.target.result;
    // If a future version opens elsewhere, step aside instead of blocking it.
    db.onversionchange = () => { db.close(); bootMessage('Notes were updated in another tab.<br>Reload this page.'); };
    loadNotebooks();
  };
  // Safety net: if nothing has resolved, say so rather than sitting blank forever.
  setTimeout(() => {
    if(!db && !memoryOnly && !songs.length){
      bootMessage('Still waiting on storage.<br>If this stays, close other tabs of this app and reload.');
    }
  }, 4000);
}

function tx(mode){ return db.transaction('songs', mode).objectStore('songs'); }
function nbTx(mode){ return db.transaction('notebooks', mode).objectStore('notebooks'); }
function metaTx(mode){ return db.transaction('meta', mode).objectStore('meta'); }
function saveOrder(){
  orderIds = songs.map(s => s.id);
  if(!db) return;
  try{ metaTx('readwrite').put({id:'order', ids: orderIds}); }catch(_){}
}
function saveSong(s){
  s.updatedAt = Date.now();
  if(!db) return;
  try{ tx('readwrite').put(s); }catch(_){}
}
function deleteSongDB(id){ if(!db) return; try{ tx('readwrite').delete(id); }catch(_){} }
function saveNotebook(n){ if(!db) return; try{ nbTx('readwrite').put(n); }catch(_){} }
function deleteNotebookDB(id){ if(!db) return; try{ nbTx('readwrite').delete(id); }catch(_){} }
function loadNotebooks(){
  const out = [];
  nbTx('readonly').openCursor().onsuccess = e => {
    const c = e.target.result;
    if(c){ out.push(c.value); c.continue(); }
    else { notebooks = out.sort((a,b)=>a.createdAt-b.createdAt); loadOrder(); }
  };
}
function loadOrder(){
  metaTx('readonly').get('order').onsuccess = e => {
    orderIds = (e.target.result && e.target.result.ids) || [];
    // Voice notes are numbered from a counter that only ever climbs, so a
    // deleted note never frees its number for reuse.
    metaTx('readonly').get('voiceSeq').onsuccess = ev => {
      voiceSeq = (ev.target.result && ev.target.result.n) || 0;
      loadSongs();
    };
  };
}
function saveVoiceSeq(){
  if(!db) return;
  try{ metaTx('readwrite').put({id:'voiceSeq', n: voiceSeq}); }catch(_){}
}
function loadSongs(){
  const out = [];
  tx('readonly').openCursor().onsuccess = e => {
    const c = e.target.result;
    if(c){ out.push(c.value); c.continue(); }
    else {
      out.sort((a,b)=>b.updatedAt-a.updatedAt);
      const pos = id => { const i = orderIds.indexOf(id); return i === -1 ? Infinity : i; };
      songs = out.sort((a,b) => pos(a.id) - pos(b.id));
      renderNotebooks(); renderList();
    }
  };
}

function renderNotebooks(){
  const row = document.getElementById('nbRow');
  const bin = document.getElementById('nbBin');
  row.classList.toggle('show', notebooks.length > 0);
  bin.classList.toggle('show', notebooks.length > 0);
  if(!notebooks.length){ row.innerHTML=''; return; }
  const slots = notebooks.map((n,i) => {
    const count = songs.filter(s=>s.notebookId===n.id).length;
    const a = coverAttrs(coverOf(n,i));
    return `<div class="nb-slot${activeNotebook===n.id?' active':''}" data-nb="${n.id}">
      <div class="nb-back${a.cls}"${a.style}></div>
      <div class="nb-cover${a.cls}"${a.style}>
        <div class="nb-label"><span>${esc(n.name)}</span></div>
        <div class="nb-count">${count}</div>
      </div></div>`;
  });
  // A trailing plus for making another notebook, up to the cap.
  if(notebooks.length < MAX_NOTEBOOKS)
    slots.push('<div class="nb-slot empty" id="nbAdd" role="button" aria-label="New notebook"><div class="nb-plus">＋</div></div>');
  row.innerHTML = slots.join('');
  updateNbFade();
  const addBtn = document.getElementById('nbAdd');
  if(addBtn) addBtn.onclick = openNewNbSheet;
  row.querySelectorAll('.nb-slot[data-nb]').forEach(el => {
    el.onclick = () => {
      if(nbLongPressed){ nbLongPressed = false; return; }
      activeNotebook = (activeNotebook === el.dataset.nb) ? null : el.dataset.nb;
      renderNotebooks(); renderList();
    };
    attachNbPress(el);
  });
}

// Cover colours. The binding tape is always black, so these only ever set the
// cover; notebooks saved before colours existed fall back by position.
const MAX_NOTEBOOKS = 20;
const COVERS = ['#2B2B2B','#9E3B32','#2F5FA8','#2E7D52','#6B4C9A','#2A7D8C',
                '#BE6A28','#A8407A','#A8862B','#55606B','marble'];
const coverOf = (n,i) => n.color || COVERS[i % COVERS.length];
// "marble" is a patterned class rather than a flat colour.
const coverAttrs = c => c === 'marble'
  ? {cls:' marble', style:''}
  : {cls:'', style:` style="background:${c}"`};

function updateNbFade(){
  const row = document.getElementById('nbRow');
  const bin = document.getElementById('nbBin');
  const scrollable = row.scrollWidth - row.clientWidth > 4;   // false at four or fewer
  bin.classList.toggle('more-right',
    scrollable && row.scrollLeft + row.clientWidth < row.scrollWidth - 4);
  bin.classList.toggle('more-left', scrollable && row.scrollLeft > 4);
}
document.getElementById('nbRow').addEventListener('scroll', updateNbFade, {passive:true});

let nbPressTimer = null, nbLongPressed = false;
function attachNbPress(el){
  el.addEventListener('pointerdown', e => {
    if(e.pointerType==='mouse' && e.button!==0) return;
    const sx=e.clientX, sy=e.clientY;
    const cancel = () => {
      clearTimeout(nbPressTimer); nbPressTimer=null;
      el.removeEventListener('pointerup', cancel);
      el.removeEventListener('pointercancel', cancel);
      el.removeEventListener('pointermove', check);
    };
    const check = ev => {
      if(Math.abs(ev.clientX-sx)>12 || Math.abs(ev.clientY-sy)>12) cancel();
    };
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('pointermove', check);
    nbPressTimer = setTimeout(() => {
      cancel();
      if(dragging) return;
      nbLongPressed = true;
      if(navigator.vibrate) navigator.vibrate(30);
      openNbSheet(el.dataset.nb);
      setTimeout(()=>{ nbLongPressed = false; }, 400);
    }, 400);
  });
}

let nbSheetId = null, nbDeleteArmed = false;
function openNbSheet(id){
  nbSheetId = id;
  const n = notebooks.find(x => x.id === id);
  if(!n) return;
  document.getElementById('nbSheetTitle').textContent = n.name;
  document.getElementById('nbRenameRow').style.display = 'none';
  document.getElementById('nbColors').style.display = 'none';
  resetNbDeleteButtons();
  document.getElementById('nbSheet').classList.add('open');
  document.getElementById('nbSheetOverlay').classList.add('open');
}
function closeNbSheet(){
  nbSheetId = null;
  document.getElementById('nbSheet').classList.remove('open');
  document.getElementById('nbSheetOverlay').classList.remove('open');
}
function sheetNotebook(){ return notebooks.find(x => x.id === nbSheetId); }
document.getElementById('nbSheetClose').onclick = closeNbSheet;
document.getElementById('nbSheetOverlay').onclick = closeNbSheet;

document.getElementById('nbRenameBtn').onclick = () => {
  const n = sheetNotebook(); if(!n) return;
  document.getElementById('nbRenameRow').style.display = 'flex';
  const inp = document.getElementById('nbRenameInput');
  inp.value = n.name;
  inp.focus(); inp.select();
};
document.getElementById('nbRenameSave').onclick = () => {
  const n = sheetNotebook(); if(!n) return;
  const v = document.getElementById('nbRenameInput').value.trim();
  if(!v){ toast('Name can\'t be empty'); return; }
  n.name = v;
  saveNotebook(n); closeNbSheet(); renderNotebooks(); renderList(); toast('Renamed');
};
document.getElementById('nbColorBtn').onclick = () => {
  const n = sheetNotebook(); if(!n) return;
  const box = document.getElementById('nbColors');
  const cur = coverOf(n, notebooks.indexOf(n));
  box.innerHTML = COVERS.map(c => {
    const a = coverAttrs(c);
    return `<button class="swatch${a.cls}${c===cur?' on':''}" data-c="${c}"${a.style}
       aria-label="cover colour"></button>`;
  }).join('');
  box.style.display = 'flex';
  box.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
    n.color = b.dataset.c;
    saveNotebook(n);
    renderNotebooks();
    box.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on', x===b));
  });
};

const nbDeleteBtn = document.getElementById('nbDeleteBtn');
const nbDeleteAllBtn = document.getElementById('nbDeleteAllBtn');

function removeNotebook(n){
  deleteNotebookDB(n.id);
  notebooks = notebooks.filter(x => x.id !== n.id);
  if(activeNotebook === n.id) activeNotebook = null;
  closeNbSheet(); renderNotebooks(); renderList();
}

// Keep the notes: they return to the main page.
nbDeleteBtn.onclick = () => {
  const n = sheetNotebook(); if(!n) return;
  const inside = songs.filter(s => s.notebookId === n.id).length;
  if(nbDeleteArmed !== 'keep'){
    resetNbDeleteButtons();
    nbDeleteArmed = 'keep';
    nbDeleteBtn.textContent = inside
      ? `Tap again — ${inside} note${inside===1?'':'s'} move${inside===1?'s':''} out`
      : 'Tap again to confirm';
    return;
  }
  songs.forEach(s => { if(s.notebookId === n.id){ s.notebookId = null; saveSong(s); } });
  removeNotebook(n);
  toast(inside ? 'Notebook deleted, notes kept' : 'Notebook deleted');
};

// Delete the notes along with the notebook.
nbDeleteAllBtn.onclick = () => {
  const n = sheetNotebook(); if(!n) return;
  const doomed = songs.filter(s => s.notebookId === n.id);
  if(nbDeleteArmed !== 'all'){
    resetNbDeleteButtons();
    nbDeleteArmed = 'all';
    nbDeleteAllBtn.textContent = doomed.length
      ? `Tap again — deletes ${doomed.length} note${doomed.length===1?'':'s'} for good`
      : 'Tap again to confirm';
    return;
  }
  doomed.forEach(s => { stopCardAudio(); deleteSongDB(s.id); });
  const ids = new Set(doomed.map(s => s.id));
  songs = songs.filter(s => !ids.has(s.id));
  saveOrder();
  removeNotebook(n);
  toast(doomed.length
    ? `Deleted notebook and ${doomed.length} note${doomed.length===1?'':'s'}`
    : 'Notebook deleted');
};

function resetNbDeleteButtons(){
  nbDeleteArmed = false;
  nbDeleteBtn.textContent = 'Delete notebook, keep notes';
  nbDeleteAllBtn.textContent = 'Delete notebook and its notes';
}

// Outlined pushpin, tilted, stroked in currentColor so it tracks the title.
const PIN_SVG = `<svg class="pin-icon" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"
  aria-label="pinned"><g transform="rotate(38 12 12)">
  <path d="M9.4 3h5.2l-1.1 6 3.2 2.6H7.3L10.5 9z"/><path d="M12 11.6v8"/>
  </g></svg>`;

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let pool;
  if(activeNotebook) pool = songs.filter(s => s.notebookId === activeNotebook);
  else if(q) pool = songs;                       // searching: reach into notebooks too
  else pool = songs.filter(s => !s.notebookId);
  const matched = pool.filter(s => (s.title+' '+(s.lyrics||'')).toLowerCase().includes(q));
  // Pinned notes ride at the top of whichever list they're in. filter() is
  // stable, so each group keeps its own drag order.
  const filtered = [...matched.filter(s => s.pinned), ...matched.filter(s => !s.pinned)];
  const list = document.getElementById('list');

  if(!filtered.length){
    let msg;
    if(q) msg = 'No matches.';
    else if(activeNotebook) msg = 'Nothing in this notebook yet.<br>Press and hold a note to drag it here.';
    else if(songs.length) msg = 'Everything is filed in a notebook.<br>Tap a notebook above to open it.';
    else msg = 'No notes yet.<br>Tap + to start.';
    list.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  list.innerHTML = filtered.map(s => {
    const nb = (!activeNotebook && q && s.notebookId)
      ? notebooks.find(n => n.id === s.notebookId) : null;
    return `
    <div class="song${s.kind==='voice'?' voice':''}${s.pinned?' pinned':''}"
         data-id="${s.id}" data-pin="${s.pinned?1:0}">
      ${s.kind==='voice' ? `<button class="card-play" data-play="${s.id}">▶</button>` : ''}
      <div class="card-body">
        ${nb ? `<div class="card-where">In ${esc(nb.name)}</div>` : ''}
        <div class="song-title">${s.pinned?PIN_SVG:''}${esc(s.title || (s.kind==='voice'?'Untitled voice note':'Untitled song note'))}</div>
        <div class="song-meta"><span>${s.clips.length} memo${s.clips.length===1?'':'s'}</span><span>${new Date(s.updatedAt).toLocaleDateString()}</span></div>
      </div>
      <button class="card-menu" data-menu="${s.id}">⋮</button>
    </div>`;
  }).join('');
  const searchingAll = !activeNotebook && !!q;
  list.querySelectorAll('.song').forEach(el => {
    el.onclick = () => { if(!justDragged) openSong(el.dataset.id); };
    if(!searchingAll) attachDrag(el);
  });
  list.querySelectorAll('.card-play').forEach(b => b.onclick = e => {
    e.stopPropagation(); cardPlay(b.dataset.play, b);
  });
  list.querySelectorAll('.card-menu').forEach(b => b.onclick = e => {
    e.stopPropagation(); openCardSheet(b.dataset.menu);
  });
}
let cardAudio = null;
function cardPlay(id, btn){
  if(cardAudio && cardAudio.id === id){ stopCardAudio(); return; }
  stopCardAudio();
  const song = songs.find(s => s.id === id);
  if(!song || !song.clips.length){ btn.textContent = '–'; setTimeout(()=>btn.textContent='▶',900); return; }
  const audio = new Audio(URL.createObjectURL(song.clips[0].blob));
  audio.onended = () => { btn.textContent = '▶'; cardAudio = null; };
  audio.play();
  btn.textContent = '■';
  cardAudio = {audio, btn, id};
}
function stopCardAudio(){
  if(cardAudio){ cardAudio.audio.pause(); cardAudio.btn.textContent = '▶'; cardAudio = null; }
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2000);
}

let cardSheetId = null, cardDeleteArmed = false;
function openCardSheet(id){
  cardSheetId = id;
  const s = songs.find(x => x.id === id);
  if(!s) return;
  document.getElementById('cardSheetTitle').textContent =
    s.title || (s.kind==='voice' ? 'Untitled voice note' : 'Untitled song note');
  document.getElementById('convertBtn').style.display = s.kind==='voice' ? 'block' : 'none';
  document.getElementById('pinBtn').textContent = s.pinned ? 'Unpin from top' : 'Pin to top';
  document.getElementById('moveList').style.display = 'none';
  cardDeleteArmed = false;
  document.getElementById('cardDeleteBtn').textContent = 'Delete';
  document.getElementById('cardSheet').classList.add('open');
  document.getElementById('cardSheetOverlay').classList.add('open');
}
function closeCardSheet(){
  cardSheetId = null;
  document.getElementById('cardSheet').classList.remove('open');
  document.getElementById('cardSheetOverlay').classList.remove('open');
}
function sheetSong(){ return songs.find(x => x.id === cardSheetId); }
document.getElementById('cardSheetClose').onclick = closeCardSheet;
document.getElementById('cardSheetOverlay').onclick = closeCardSheet;

document.getElementById('convertBtn').onclick = () => {
  const s = sheetSong(); if(!s) return;
  s.kind = 'song';

let vStream=null, vAudioCtx=null, vAnalyser=null, vRAF=null, vData=null;
let vRec=null, vChunks=[], vIntent=null;
let vElapsed=0, vSince=0, vTick=null;

const vPop   = document.getElementById('voicePop');
const vOver  = document.getElementById('voiceOverlay');
const vIdle  = document.getElementById('voiceIdle');
const vLive  = document.getElementById('voiceLive');
const vTime  = document.getElementById('voiceTime');
const vCanvas= document.getElementById('wave');
const vRecBtn= document.getElementById('vRecord');
const vPauseBtn = document.getElementById('vPause');

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function totalMs(){
  return vElapsed + (vSince ? Date.now()-vSince : 0);
}
function startTick(){
  clearInterval(vTick);
  vTick = setInterval(()=>{ vTime.textContent = fmtTime(totalMs()); }, 200);
}

async function openVoicePop(){
  vIntent=null; vChunks=[]; vElapsed=0; vSince=0;
  vTime.textContent='0:00'; vTime.classList.remove('live');
  vIdle.style.display='grid'; vLive.style.display='none';
  vPauseBtn.textContent='Pause';
  vRecBtn.disabled=false;
  document.getElementById('voiceHead').textContent='New voice note';
  vPop.classList.add('open'); vOver.classList.add('open');
  sizeWave();
  try{
    vStream = await navigator.mediaDevices.getUserMedia({audio:true});
    vAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    vAnalyser = vAudioCtx.createAnalyser();
    vAnalyser.fftSize = 1024;
    vData = new Uint8Array(vAnalyser.fftSize);
    vAudioCtx.createMediaStreamSource(vStream).connect(vAnalyser);
    drawWave();                       // live from the moment the popup opens
  }catch(err){
    vRecBtn.disabled = true;
    document.getElementById('voiceHead').textContent = micProblem(err);
    drawFlat();
  }
}
function closeVoicePop(){
  clearInterval(vTick); vTick=null;
  cancelAnimationFrame(vRAF); vRAF=null;
  if(vRec && vRec.state !== 'inactive'){ vIntent='cancel'; try{ vRec.stop(); }catch(_){} }
  vRec=null; vChunks=[];
  if(vStream){ vStream.getTracks().forEach(t=>t.stop()); vStream=null; }
  if(vAudioCtx){ try{ vAudioCtx.close(); }catch(_){} vAudioCtx=null; }
  vAnalyser=null; vElapsed=0; vSince=0;
  vPop.classList.remove('open'); vOver.classList.remove('open');
}

function sizeWave(){
  const dpr = window.devicePixelRatio || 1;
  vCanvas.width  = Math.max(1, vCanvas.clientWidth  * dpr);
  vCanvas.height = Math.max(1, vCanvas.clientHeight * dpr);
}
function waveStyle(){
  const cs = getComputedStyle(document.body);
  return { line: cs.getPropertyValue('--ink').trim() || '#888',
           dim:  cs.getPropertyValue('--rule').trim() || '#555' };
}
function drawFlat(){
  const c = vCanvas.getContext && vCanvas.getContext('2d');
  if(!c) return;
  const {dim} = waveStyle();
  c.clearRect(0,0,vCanvas.width,vCanvas.height);
  c.strokeStyle = dim; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, vCanvas.height/2); c.lineTo(vCanvas.width, vCanvas.height/2); c.stroke();
}
function drawWave(){
  if(!vAnalyser) return;
  const c = vCanvas.getContext && vCanvas.getContext('2d');
  if(!c) return;
  const w = vCanvas.width, h = vCanvas.height;
  const recording = vRec && vRec.state === 'recording';
  const {line, dim} = waveStyle();
  vAnalyser.getByteTimeDomainData(vData);
  c.clearRect(0,0,w,h);
  c.lineWidth = Math.max(1.5, 2*(window.devicePixelRatio||1));
  c.strokeStyle = recording ? (getComputedStyle(document.body).getPropertyValue('--danger').trim()||line) : line;
  c.globalAlpha = recording ? 1 : .75;
  c.beginPath();
  const step = w / vData.length;
  for(let i=0;i<vData.length;i++){
    const y = (vData[i]/128) * (h/2);
    i ? c.lineTo(i*step, y) : c.moveTo(0, y);
  }
  c.stroke();
  c.globalAlpha = 1;
  vRAF = requestAnimationFrame(drawWave);
}

function newRecorder(){
  vChunks = [];
  vRec = new MediaRecorder(vStream);
  vRec.ondataavailable = e => { if(e.data && e.data.size) vChunks.push(e.data); };
  vRec.onstop = () => {
    const intent = vIntent; vIntent = null;
    if(intent === 'save'){
      const blob = new Blob(vChunks, {type: vRec.mimeType || 'audio/webm'});
      saveVoiceNote(blob);
      closeVoicePop();
    } else if(intent === 'retry'){
      vElapsed = 0; vSince = Date.now();
      vTime.textContent = '0:00';
      vPauseBtn.textContent = 'Pause';
      newRecorder(); vRec.start(); startTick();
    }
    // 'cancel' needs nothing: closeVoicePop already tore everything down.
  };
}
document.getElementById('vRecord').onclick = () => {

};
vPauseBtn.onclick = () => {
  if(!vRec) return;

    vRec.pause();
    vElapsed = totalMs(); vSince = 0;

    vTime.textContent = fmtTime(vElapsed);
    vTime.classList.remove('live');
    vPauseBtn.textContent = 'Resume';
  } else if(vRec.state === 'paused'){
    vRec.resume();

let dragEl=null, ghost=null, justDragged=false, pressTimer=null, didReorder=false;
let dragging=false, lastX=0, lastY=0;

function blockScroll(e){ if(dragging) e.preventDefault(); }
function blockMenu(e){ if(dragging) e.preventDefault(); }

function attachDrag(el){
  el.addEventListener('pointerdown', e => {
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(e.target.closest('.card-play, .card-menu')) return;
    const sx=e.clientX, sy=e.clientY, pid=e.pointerId;
    const cancel = () => {
      clearTimeout(pressTimer); pressTimer=null;
      el.removeEventListener('pointerup', cancel);
      el.removeEventListener('pointercancel', cancel);
      el.removeEventListener('pointermove', check);
    };
    const check = ev => {
      if(Math.abs(ev.clientX-sx)>12 || Math.abs(ev.clientY-sy)>12) cancel();
    };
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('pointermove', check);
    pressTimer = setTimeout(() => { cancel(); startDrag(el, sx, sy, pid); }, 350);
  });
}
function startDrag(el, x, y, pid){
  if(dragging) return;
  dragging = true; dragEl = el; didReorder = false;
  lastX = x; lastY = y;
  // Never hold pointer capture: moving this node in the DOM would drop the
  // capture and the release event would never arrive.
  try{ if(el.hasPointerCapture(pid)) el.releasePointerCapture(pid); }catch(_){}
  el.classList.add('drag-source');
  ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = el.querySelector('.song-title').textContent;
  ghost.style.width = el.offsetWidth + 'px';
  document.body.appendChild(ghost);
  moveGhost(x, y);
  if(navigator.vibrate) navigator.vibrate(30);
  document.addEventListener('touchmove', blockScroll, {passive:false});
  document.addEventListener('contextmenu', blockMenu);
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
  window.addEventListener('blur', onDragEnd);
}
function moveGhost(x, y){
  ghost.style.left = (x - ghost.offsetWidth/2) + 'px';
  ghost.style.top  = (y - ghost.offsetHeight/2) + 'px';
}
function slotAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.nb-slot[data-nb]') : null;
}
// While dragging, holding near either end of the notebook row scrolls it, so
// notebooks past the fourth are still reachable as drop targets.
let edgeScroll=0, edgeRAF=null;
function stepEdgeScroll(){
  if(!dragging || !edgeScroll){ edgeRAF=null; return; }
  const row=document.getElementById('nbRow');
  row.scrollLeft += edgeScroll;
  updateNbFade();
  edgeRAF=requestAnimationFrame(stepEdgeScroll);
}
function updateEdgeScroll(x, y){
  const row=document.getElementById('nbRow');
  edgeScroll=0;
  if(row.classList.contains('show')){
    const r=row.getBoundingClientRect();
    if(y>=r.top-24 && y<=r.bottom+24){
      if(x < r.left+58) edgeScroll=-9;
      else if(x > r.right-58) edgeScroll=9;
    }
  }
  if(edgeScroll && !edgeRAF) edgeRAF=requestAnimationFrame(stepEdgeScroll);
}
function onDragMove(e){
  if(!dragging) return;
  e.preventDefault();
  lastX = e.clientX; lastY = e.clientY;
  moveGhost(lastX, lastY);
  document.querySelectorAll('.nb-slot').forEach(s=>s.classList.remove('drop-target'));
  updateEdgeScroll(lastX, lastY);
  const hit = slotAt(lastX, lastY);
  if(hit){ hit.classList.add('drop-target'); return; }
  const over = document.elementFromPoint(lastX, lastY);
  const card = over ? over.closest('.song') : null;
  // Reordering stays within its own group: pinned notes shuffle among pinned,
  // unpinned among unpinned, so a drag can't silently pin or unpin a note.
  if(card && card !== dragEl && card.parentElement === dragEl.parentElement
     && card.dataset.pin === dragEl.dataset.pin){
    const r = card.getBoundingClientRect();
    const after = lastY > r.top + r.height/2;
    card.parentElement.insertBefore(dragEl, after ? card.nextSibling : card);
    didReorder = true;
  }
}
function commitReorder(){
  const domIds = [...document.querySelectorAll('#list .song')].map(el => el.dataset.id);
  const visible = new Set(domIds);
  const byId = Object.fromEntries(songs.map(s => [s.id, s]));
  let k = 0;
  songs = songs.map(s => visible.has(s.id) ? byId[domIds[k++]] : s);
  saveOrder();
}
function onDragEnd(e){
  if(!dragging) return;          // single-shot: never run twice
  dragging = false;
  const x = (e && e.clientX != null) ? e.clientX : lastX;
  const y = (e && e.clientY != null) ? e.clientY : lastY;
  document.removeEventListener('touchmove', blockScroll, {passive:false});
  document.removeEventListener('contextmenu', blockMenu);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  window.removeEventListener('blur', onDragEnd);
  edgeScroll = 0;
  const el = dragEl;
  const hit = slotAt(x, y);
  if(ghost){ ghost.remove(); ghost = null; }
  document.querySelectorAll('.nb-slot').forEach(s=>s.classList.remove('drop-target'));
  if(el) el.classList.remove('drag-source');
  dragEl = null;
  justDragged = true;
  setTimeout(()=>{ justDragged=false; }, 300);
  if(hit && el){
    const song = songs.find(s => s.id === el.dataset.id);
    if(song){ song.notebookId = hit.dataset.nb; saveSong(song); }
    renderNotebooks(); renderList();
  } else if(didReorder){
    commitReorder();   // DOM already shows the new order; don't re-render
    renderNotebooks();
  }
  didReorder = false;
}

// ---- Rhyme engine: CMU Pronouncing Dictionary ----------------------------
// rhymes.txt holds one line per rhyme group: "AA R T|art13 part13 heart13"
// The key is the phonetic tail from the last stressed vowel. Each word carries
// two trailing digits: frequency tier (0 = most common, 9 = not in the list)
// and syllable count.
const CONS_CLASS={P:1,B:1,T:1,D:1,K:1,G:1, F:2,V:2,TH:2,DH:2,S:2,Z:2,SH:2,ZH:2,
  M:3,N:3,NG:3, L:4,R:4, CH:5,JH:5, HH:6,W:6,Y:6};
const IS_VOWEL=/^(AA|AE|AH|AO|AW|AY|EH|ER|EY|IH|IY|OW|OY|UH|UW)$/;
let dict=null, dictState='idle';   // idle | loading | ready | failed
const groups=[];                   // {vowel, lastVowel, coda, last, words:[]}
const wordMeta=new Map();          // word -> tier*10 + syllables
const wordGroups=new Map();        // word -> [groupIdx, ...]  (one per pronunciation)

async function loadDict(){
  if(dictState==='loading'||dictState==='ready') return dictState;
  dictState='loading';
  try{
    const res=await fetch('rhymes.txt');
    if(!res.ok) throw new Error('http '+res.status);
    const text=await res.text();
    for(const line of text.split('\n')){
      const bar=line.indexOf('|');
      if(bar<1) continue;
      const ph=line.slice(0,bar).split(' ');
      const gi=groups.length;
      const words=[];
      for(const tok of line.slice(bar+1).split(' ')){
        if(tok.length<3) continue;
        const w=tok.slice(0,-2);
        words.push(w);
        if(!wordMeta.has(w)) wordMeta.set(w, (+tok[tok.length-2])*10 + (+tok[tok.length-1]));
        const list=wordGroups.get(w);
        if(list) list.push(gi); else wordGroups.set(w,[gi]);
      }
      let lastVowel=ph[0];
      for(let k=ph.length-1;k>=0;k--) if(IS_VOWEL.test(ph[k])){ lastVowel=ph[k]; break; }
      // "reduced" = every vowel after the stressed one is a schwa (AH). A weak
      // trailing syllable (purple = ER + schwa + L) still rhymes with girl;
      // a full trailing vowel (compact = AA + AE K T) does not rhyme with got.
      const after=ph.slice(1).filter(x=>IS_VOWEL.test(x));
      groups.push({vowel:ph[0], lastVowel, coda:ph.slice(1).join(' '),
                   last:ph[ph.length-1], reduced:after.every(v=>v==='AH'), words});
    }
    dict=true; dictState='ready';
    if(current && current.kind!=='voice') autoGrowLyrics();   // redo counts with real data
  }catch(err){
    dictState='failed';
  }
  return dictState;
}
const metaOf=w=>wordMeta.get(w);
const tierOf=m=>Math.floor(m/10);
const sylOf=m=>m%10;

// Results are grouped by syllable count, shortest first, so one-syllable
// rhymes are always reachable instead of being crowded out by longer ones.
// Returns [[syllables, [words]], ...] ascending, or null for an unknown word.
function bucketBySyllables(scored, perBucket=50){
  const best=new Map();                       // dedupe across pronunciations
  for(const [w,rv] of scored) if(!best.has(w) || rv<best.get(w)) best.set(w,rv);
  const buckets=new Map();
  for(const [w,rv] of best){
    const s=sylOf(metaOf(w)) || 1;
    if(!buckets.has(s)) buckets.set(s,[]);
    buckets.get(s).push([w,rv]);
  }
  return [...buckets.keys()].sort((a,b)=>a-b).map(s=>[
    s,
    buckets.get(s).sort((a,b)=>a[1]-b[1]||a[0].length-b[0].length)
      .slice(0,perBucket).map(p=>p[0])
  ]).filter(b=>b[1].length);
}
function perfectRhymes(word){
  const gis=wordGroups.get(word); if(!gis) return null;
  const scored=[];
  for(const gi of gis)                        // every pronunciation of the word
    for(const w of groups[gi].words){
      if(w===word) continue;
      const t=tierOf(metaOf(w));
      if(t<9) scored.push([w,t]);             // lower tier = more common = better
    }
  return bucketBySyllables(scored);
}
function slantRhymes(word){
  const gis=wordGroups.get(word); if(!gis) return null;
  const out=[];
  for(const gi of gis){
    const g=groups[gi];
    for(const h of groups){
      // The stressed vowel must match, and so must the final-syllable vowel —
      // unless both trailing syllables are weak schwas. Without that second
      // test, compact (AA..AE K T) matches "got" (AA T) on the stressed vowel
      // and last consonant alone; with it too strictly, purple loses "girl".
      if(h.vowel!==g.vowel || h.coda===g.coda) continue;
      if(h.lastVowel!==g.lastVowel && !(h.reduced && g.reduced)) continue;
      let base=50;
      if(h.lastVowel!==g.lastVowel) base-=15;      // weaker than an exact ending
      if(h.last===g.last) base+=25;
      else if(CONS_CLASS[h.last] && CONS_CLASS[h.last]===CONS_CLASS[g.last]) base+=15;
      else if(!h.coda || !g.coda) base+=5;
      else continue;
      for(const w of h.words){
        if(w===word) continue;
        const tier=tierOf(metaOf(w));
        if(tier>=9) continue;                 // common words only, or it's noise
        out.push([w, -(base + (9-tier)*9)]);  // negated so lower = better
      }
    }
  }
  return bucketBySyllables(out);
}
// Dictionary syllable count, falling back to spelling when a word is unknown.
function syllablesOf(word){
  const i=metaOf(word);
  if(i!==undefined){ const s=sylOf(i); if(s) return s; }
  return null;
}

let rhymeMode=false, rhymeType='perfect', rhymeWord='';
const bottombar = document.getElementById('bottombar');
const rhymebar = document.getElementById('rhymebar');
const pickPrompt = document.getElementById('pickPrompt');
const rhymePanel = document.getElementById('rhymePanel');

function openRhyme(){
  rhymeMode = true; rhymeWord='';
  bottombar.style.display='none';
  rhymebar.style.display='flex';
  pickPrompt.textContent = dictState==='ready'
    ? 'Tap a word in your lyrics to find rhymes'
    : 'Loading rhyme dictionary…';
  pickPrompt.classList.add('open');
  rhymePanel.classList.remove('open');
  setRhymeType('perfect');
  loadDict().then(st => {
    if(!rhymeMode) return;
    if(st==='ready' && !rhymeWord) pickPrompt.textContent='Tap a word in your lyrics to find rhymes';
    if(st==='failed') pickPrompt.textContent='Rhyme dictionary couldn\'t load — reload to retry';
    if(st==='ready' && rhymeWord) showRhymes(rhymeWord);
  });
}
function closeRhyme(){
  rhymeMode = false; rhymeWord='';
  rhymebar.style.display='none';
  bottombar.style.display='flex';
  pickPrompt.classList.remove('open');
  rhymePanel.classList.remove('open');
}
function setRhymeType(t){
  rhymeType = t;
  document.getElementById('perfectBtn').classList.toggle('on', t==='perfect');
  document.getElementById('slantBtn').classList.toggle('on', t==='slant');
  if(rhymeWord) showRhymes(rhymeWord);
}
function showRhymes(word){
  rhymeWord = word;
  const clean = word.toLowerCase().replace(/[^a-z']/g,'').replace(/'/g,'');
  pickPrompt.classList.remove('open');
  const label = document.getElementById('rhymeWordLabel');
  const box = document.getElementById('rhymeResults');
  label.textContent = `${rhymeType==='perfect'?'Perfect':'Slant'} rhymes for "${clean}"`;
  rhymePanel.classList.add('open');

  if(dictState!=='ready'){
    box.innerHTML = `<div class="sheet-empty">${dictState==='failed'
      ? 'Rhyme dictionary couldn\'t load — reload the page to retry.'
      : 'Loading rhyme dictionary…'}</div>`;
    loadDict().then(st => { if(rhymeMode && rhymeWord===word && st==='ready') showRhymes(word); });
    return;
  }
  const buckets = rhymeType==='perfect' ? perfectRhymes(clean) : slantRhymes(clean);
  if(buckets===null){
    box.innerHTML = `<div class="sheet-empty">"${esc(clean)}" isn't in the pronunciation dictionary.</div>`;
    return;
  }
  const syl = syllablesOf(clean);
  if(syl) label.textContent += ` · ${syl} syllable${syl===1?'':'s'}`;
  box.innerHTML = buckets.length
    ? buckets.map(([s,ws]) =>
        `<div class="rhyme-group">${s} syllable${s===1?'':'s'}</div>` +
        ws.map(w=>`<span class="rhyme-word">${w}</span>`).join('')
      ).join('')
    : `<div class="sheet-empty">No ${rhymeType} rhymes found${rhymeType==='perfect'?' — try Slant.':'.'}</div>`;
}
document.getElementById('rhymeBtn').onclick = openRhyme;
document.getElementById('rhymeBackBtn').onclick = closeRhyme;
document.getElementById('perfectBtn').onclick = () => setRhymeType('perfect');
document.getElementById('slantBtn').onclick = () => setRhymeType('slant');
document.getElementById('lyricsInput').addEventListener('click', () => {
  if(!rhymeMode) return;
  const ta = document.getElementById('lyricsInput');
  const text = ta.value; const pos = ta.selectionStart;
  const isWord = c => /[a-zA-Z']/.test(c);
  let s=pos, e=pos;
  while(s>0 && isWord(text[s-1])) s--;
  while(e<text.length && isWord(text[e])) e++;
  const word = text.slice(s,e);
  if(word) showRhymes(word);
});
let saveT;
function scheduleSave(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { if(current) saveSong(current); }, 400);
}
document.getElementById('titleInput').oninput = e => { current.title = e.target.value; scheduleSave(); };
document.getElementById('lyricsInput').oninput = e => {
  current.lyrics = e.target.value; scheduleSave(); autoGrowLyrics();
};

// Spelling-based estimate, used before the dictionary loads and for words it lacks.
function guessSyllables(w){
  let n = (w.match(/[aeiouy]+/g) || []).length;
  if(w.length>2 && w.endsWith('e') && !w.endsWith('le') && n>1) n--;
  if(w.endsWith('le') && w.length>2 && !'aeiouy'.includes(w[w.length-3])) n++;
  return Math.max(1, n);
}
function countSyllables(line){
  const words = line.trim().split(/\s+/).filter(Boolean);
  let total = 0;
  for(let w of words){
    w = w.toLowerCase().replace(/[^a-z']/g,'');
    if(!w) continue;
    const exact = syllablesOf(w.replace(/'/g,'')) || syllablesOf(w);
    total += exact || guessSyllables(w);
  }
  return total;
}
function autoGrowLyrics(){
  const ta = document.getElementById('lyricsInput');
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  renderLineGutter();
}
function renderLineGutter(){
  const ta = document.getElementById('lyricsInput');
  const mirror = document.getElementById('lyricsMirror');
  const gutter = document.getElementById('lineGutter');
  mirror.style.width = ta.clientWidth + 'px';
  const lines = ta.value.split('\n');
  gutter.innerHTML = lines.map(line => {
    mirror.textContent = line.length ? line : ' ';
    const rows = Math.max(1, Math.round(mirror.scrollHeight / 34));
    const label = line.trim() ? countSyllables(line) : '';
    return `<div style="height:${rows*34}px">${label}</div>`;
  }).join('');
}
window.addEventListener('resize', () => { if(current) autoGrowLyrics(); });

// Warm the rhyme dictionary in the background so it's ready on first use.
if('requestIdleCallback' in window) requestIdleCallback(()=>loadDict(), {timeout:4000});
else setTimeout(()=>loadDict(), 1500);

function renderClips(){
  const wrap = document.getElementById('clips');
  document.getElementById('clipCountLabel').textContent = current.clips.length ? `Recordings (${current.clips.length})` : 'Recordings';
  if(!current.clips.length){ wrap.innerHTML = '<div class="sheet-empty">No takes yet. Tap Record to add one.</div>'; return; }
  wrap.innerHTML = current.clips.map((c,i) => `
    <div class="clip" data-i="${i}">
      <button class="playbtn" data-i="${i}">▶</button>
      <div><div class="clip-name">Take ${i+1}</div><div class="clip-date">${new Date(c.createdAt).toLocaleString()}</div></div>
      <span style="flex:1"></span>
      <button class="clip-del" data-i="${i}">✕</button>
    </div>`).join('');
  wrap.querySelectorAll('.playbtn').forEach(b => b.onclick = () => togglePlay(+b.dataset.i, b));
  wrap.querySelectorAll('.clip-del').forEach(b => b.onclick = () => {
    current.clips.splice(+b.dataset.i,1); saveSong(current); renderClips();
  });
}
function stopAudio(){ if(activeAudio){ activeAudio.audio.pause(); activeAudio.btn.textContent='▶'; activeAudio=null; } }
function togglePlay(i, btn){
  if(activeAudio && activeAudio.i === i){ stopAudio(); return; }
  stopAudio();
  const url = URL.createObjectURL(current.clips[i].blob);
  const audio = new Audio(url);
  audio.onended = () => { btn.textContent='▶'; activeAudio=null; };
  audio.play();
  btn.textContent = '■';
  activeAudio = {audio, btn, i};
}

/* ---- Recording inside a lyric note -------------------------------------
   No popup over the words: the button bar swaps to Pause / Retry / Save /
   Cancel and a slim strip sits above it, so the lyrics stay visible and
   scrollable while you sing. */
const recBtn   = document.getElementById('recBtn');
const recLabel = document.getElementById('recLabel');
const recbar   = document.getElementById('recbar');
const recStrip = document.getElementById('recStrip');
const miniWave = document.getElementById('miniWave');
const eePause  = document.getElementById('eePause');
const stripTime= document.getElementById('recStripTime');

let eStream=null, eCtx=null, eAnalyser=null, eData=null, eRAF=null;
let eRec=null, eChunks=[], eIntent=null, eElapsed=0, eSince=0, eTick=null;

const eTotal = () => eElapsed + (eSince ? Date.now()-eSince : 0);
function eStartTick(){
  clearInterval(eTick);
  eTick = setInterval(()=>{ stripTime.textContent = fmtTime(eTotal()); }, 200);
}
function eDrawWave(){
  if(!eAnalyser){ eRAF=null; return; }
  const c = miniWave.getContext && miniWave.getContext('2d');
  if(c){
    const w=miniWave.width, h=miniWave.height;
    const paused = eRec && eRec.state === 'paused';
    const cs = getComputedStyle(document.body);
    eAnalyser.getByteTimeDomainData(eData);
    c.clearRect(0,0,w,h);
    c.lineWidth = Math.max(1.2, 1.6*(window.devicePixelRatio||1));
    c.strokeStyle = (paused ? cs.getPropertyValue('--ink-dim') : cs.getPropertyValue('--danger')).trim() || '#c55';
    c.beginPath();
    const step = w / eData.length;
    for(let i=0;i<eData.length;i++){
      const y = (eData[i]/128) * (h/2);
      i ? c.lineTo(i*step, y) : c.moveTo(0, y);
    }
    c.stroke();
  }
  eRAF = requestAnimationFrame(eDrawWave);
}
function eSizeWave(){
  const dpr = window.devicePixelRatio || 1;
  miniWave.width  = Math.max(1, miniWave.clientWidth  * dpr);
  miniWave.height = Math.max(1, miniWave.clientHeight * dpr);
}
function eShowBar(on){
  bottombar.style.display = on ? 'none' : 'flex';
  recbar.style.display    = on ? 'flex' : 'none';
  recStrip.classList.toggle('open', on);
  document.getElementById('editor').classList.toggle('recording', on);
}
function eNewRecorder(){
  eChunks = [];
  eRec = new MediaRecorder(eStream);
  eRec.ondataavailable = ev => { if(ev.data && ev.data.size) eChunks.push(ev.data); };
  eRec.onstop = () => {
    const intent = eIntent; eIntent = null;
    if(intent === 'save'){
      const blob = new Blob(eChunks, {type: eRec.mimeType || 'audio/webm'});
      if(current){
        current.clips.push({createdAt: Date.now(), blob});
        saveSong(current); renderClips();
      }
      eStopAll();
      toast('Take saved');
    } else if(intent === 'retry'){
      eElapsed = 0; eSince = Date.now();
      stripTime.textContent = '0:00';
      eePause.textContent = 'Pause';
      recStrip.classList.remove('paused');
      eNewRecorder(); eRec.start(); eStartTick();
    } else {
      eStopAll();
    }
  };
}
function eStopAll(){
  clearInterval(eTick); eTick=null;
  cancelAnimationFrame(eRAF); eRAF=null;
  eRec=null; eChunks=[]; eElapsed=0; eSince=0;
  if(eStream){ eStream.getTracks().forEach(t=>t.stop()); eStream=null; }
  if(eCtx){ try{ eCtx.close(); }catch(_){} eCtx=null; }
  eAnalyser=null;
  eePause.textContent='Pause';
  recStrip.classList.remove('paused');
  stripTime.textContent='0:00';
  eShowBar(false);
}
recBtn.onclick = async () => {
  if(eRec) return;                       // already in a take
  try{
    eStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){ toast(micProblem(err)); return; }
  eShowBar(true);
  eSizeWave();
  try{
    eCtx = new (window.AudioContext||window.webkitAudioContext)();
    eAnalyser = eCtx.createAnalyser();
    eAnalyser.fftSize = 512;
    eData = new Uint8Array(eAnalyser.fftSize);
    eCtx.createMediaStreamSource(eStream).connect(eAnalyser);
    eDrawWave();
  }catch(_){ /* waveform is a nicety; recording still proceeds */ }
  eNewRecorder(); eRec.start();
  eElapsed = 0; eSince = Date.now(); eStartTick();
  stripTime.textContent = '0:00';
};
eePause.onclick = () => {
  if(!eRec) return;
  if(eRec.state === 'recording'){
    eRec.pause();
    eElapsed = eTotal(); eSince = 0;
    clearInterval(eTick); eTick=null;
    stripTime.textContent = fmtTime(eElapsed);
    eePause.textContent = 'Resume';
    recStrip.classList.add('paused');
  } else if(eRec.state === 'paused'){
    eRec.resume();
    eSince = Date.now(); eStartTick();
    eePause.textContent = 'Pause';
    recStrip.classList.remove('paused');
  }
};
document.getElementById('eeRetry').onclick = () => {
  if(!eRec) return;
  eIntent = 'retry';
  try{ eRec.stop(); }catch(_){}
};
document.getElementById('eeSave').onclick = () => {
  if(!eRec) return;
  eIntent = 'save';
  try{ eRec.stop(); }catch(_){}
};
document.getElementById('eeCancel').onclick = () => {
  if(!eRec){ eStopAll(); return; }
  eIntent = 'cancel';
  try{ eRec.stop(); }catch(_){}
};
window.addEventListener('resize', () => { if(eAnalyser) eSizeWave(); });
// Say which of the several "no microphone" cases actually happened, since the
// fix differs: an embedded frame is denied the mic no matter what the browser
// permission says, and that one is only fixable by opening the page directly.
function micProblem(err){
  const framed = window.self !== window.top;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return framed ? 'Open this page in its own tab to record'
                  : 'This browser can\'t record audio here';
  switch(err && err.name){
    case 'NotAllowedError':
    case 'SecurityError':
      return framed ? 'Open this page in its own tab to record'
                    : 'Microphone blocked — allow it in site settings, then reload';
    case 'NotFoundError':
    case 'OverconstrainedError':
      return 'No microphone found on this device';
    case 'NotReadableError':
      return 'Mic is in use by another app';
    default:
      return 'Couldn\'t start recording' + (err && err.name ? ' ('+err.name+')' : '');
  }
}
